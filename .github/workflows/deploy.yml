name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/mobile-number-puzzle-game-xz3hx9
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # dist/를 gh-pages 브랜치로 푸시 → GitHub Pages가 해당 브랜치를 서빙
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
